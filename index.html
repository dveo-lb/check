<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام تدقيق المهام | Discord Audit</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --discord: #5865F2;
      --discord-hover: #4752C4;
      --ok: #10b981;
      --no: #ef4444;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 1100px; margin: auto; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card); padding: 16px 24px; border-radius: 12px;
      border: 1px solid var(--border); margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
    }
    .user-box { display: flex; align-items: center; gap: 12px; }
    .user-box img { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--discord); }
    button {
      background: var(--discord); color: #fff; border: none; padding: 10px 16px;
      border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s;
    }
    button:hover { background: var(--discord-hover); }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }
    button.btn-ok { background: rgba(16, 185, 129, 0.2); color: var(--ok); border: 1px solid var(--ok); padding: 6px 10px; }
    button.btn-no { background: rgba(239, 68, 68, 0.2); color: var(--no); border: 1px solid var(--no); padding: 6px 10px; }

    .settings-panel {
      background: var(--card); padding: 20px; border-radius: 12px;
      border: 1px solid var(--border); margin-bottom: 20px; display: none;
    }
    .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 12px; }
    input {
      width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
      background: #0f172a; color: #fff; margin-top: 4px;
    }
    label { font-size: 13px; color: var(--muted); }

    .filters { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .badge-ok { background: rgba(16, 185, 129, 0.15); color: var(--ok); }
    .badge-no { background: rgba(239, 68, 68, 0.15); color: var(--no); }
    .badge-pending { background: rgba(245, 158, 11, 0.15); color: var(--warn); }

    table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 12px; overflow: hidden; }
    th, td { padding: 14px; text-align: right; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { background: #162032; color: var(--muted); font-weight: 600; }
    tr:hover { background: rgba(255,255,255,0.02); }
    .missing { color: var(--no); font-style: italic; font-size: 12px; }
    .raw-msg { max-width: 280px; white-space: pre-wrap; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h2 style="margin:0; font-size: 20px;">لوحة تدقيق المهام والتقارير</h2>
      <small style="color:var(--muted)">App ID: 1573639825989308546 • مزامنة مباشرة مع قناة Discord</small>
    </div>
    <div class="user-box" id="authSection">
      <button onclick="loginWithDiscord()">🔗 اتصال فوري بحساب Discord</button>
      <button class="secondary" onclick="toggleSettings()">⚙️ الإعدادات</button>
    </div>
  </header>

  <div class="settings-panel" id="settingsPanel">
    <h3 style="margin-top:0">إعدادات الربط (محفوظة في متصفحك فقط)</h3>
    <div class="settings-grid">
      <div>
        <label>Discord Client / Application ID</label>
        <input type="text" id="clientId" value="1573639825989308546" />
      </div>
      <div>
        <label>Discord Bot Token (لجلب الرسائل)</label>
        <input type="password" id="botToken" placeholder="أدخل Bot Token هنا" />
      </div>
      <div>
        <label>Channel ID (معرّف قناة المهام)</label>
        <input type="text" id="channelId" placeholder="987654321098765432" />
      </div>
    </div>
    <button onclick="saveSettings()">💾 حفظ وتحديث البيانات</button>
  </div>

  <div class="filters">
    <button class="secondary" onclick="setFilter('all')">الكل (<span id="countAll">0</span>)</button>
    <button class="secondary" onclick="setFilter('ok')">✅ مقبول (<span id="countOk">0</span>)</button>
    <button class="secondary" onclick="setFilter('no')">❌ مرفوض (<span id="countNo">0</span>)</button>
    <button class="secondary" onclick="setFilter('pending')">⏳ غير مدقق (<span id="countPending">0</span>)</button>
    <button onclick="fetchMessages()" style="margin-right:auto">🔄 تحديث المنشورات</button>
  </div>

  <div style="overflow-x:auto;">
    <table>
      <thead>
        <tr>
          <th>الناشر</th>
          <th>الاسم المستخرج</th>
          <th>التاريخ</th>
          <th>الوقت</th>
          <th>حالة الإشارة</th>
          <th>نص المنشور</th>
          <th>إجراء سريع</th>
        </tr>
      </thead>
      <tbody id="auditTable">
        <tr><td colspan="7" style="text-align:center; color:var(--muted)">يرجى ضبط الإعدادات والاتصال لعرض المنشورات...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  const DEFAULT_CLIENT_ID = "1573639825989308546";
  let allParsedPosts = [];
  let currentFilter = 'all';

  window.onload = async () => {
    const savedClientId = localStorage.getItem('dc_client_id') || DEFAULT_CLIENT_ID;
    document.getElementById('clientId').value = savedClientId;
    document.getElementById('botToken').value = localStorage.getItem('dc_bot_token') || '';
    document.getElementById('channelId').value = localStorage.getItem('dc_channel_id') || '';

    const hash = new URLSearchParams(window.location.hash.slice(1));
    const accessToken = hash.get('access_token');
    if (accessToken) {
      localStorage.setItem('dc_user_token', accessToken);
      history.replaceState(null, null, window.location.pathname);
    }

    await checkUserSession();
    if (localStorage.getItem('dc_bot_token') && localStorage.getItem('dc_channel_id')) {
      fetchMessages();
    } else {
      document.getElementById('settingsPanel').style.display = 'block';
    }
  };

  function toggleSettings() {
    const panel = document.getElementById('settingsPanel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  }

  function saveSettings() {
    localStorage.setItem('dc_client_id', document.getElementById('clientId').value.trim() || DEFAULT_CLIENT_ID);
    localStorage.setItem('dc_bot_token', document.getElementById('botToken').value.trim());
    localStorage.setItem('dc_channel_id', document.getElementById('channelId').value.trim());
    toggleSettings();
    fetchMessages();
  }

  function loginWithDiscord() {
    const clientId = (localStorage.getItem('dc_client_id') || document.getElementById('clientId').value || DEFAULT_CLIENT_ID).trim();
    const redirectUri = encodeURIComponent(window.location.origin + window.location.pathname);
    window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${clientId}&redirect_uri=${redirectUri}&response_type=token&scope=identify`;
  }

  async function checkUserSession() {
    const token = localStorage.getItem('dc_user_token');
    if (!token) return;
    try {
      const res = await fetch('https://discord.com/api/users/@me', {
        headers: { Authorization: `Bearer ${token}` }
      });
      if (!res.ok) {
        localStorage.removeItem('dc_user_token');
        return;
      }
      const user = await res.json();
      const avatar = user.avatar
        ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.png`
        : `https://cdn.discordapp.com/embed/avatars/0.png`;

      document.getElementById('authSection').innerHTML = `
        <img src="${avatar}" alt="avatar">
        <div>
          <div style="font-weight:bold; font-size:14px;">${user.global_name || user.username}</div>
          <small style="color:var(--ok)">● متصل عبر المتصفح</small>
        </div>
        <button class="secondary" onclick="toggleSettings()">⚙️</button>
      `;
    } catch (e) { console.error(e); }
  }

  async function fetchMessages() {
    const botToken = localStorage.getItem('dc_bot_token');
    const channelId = localStorage.getItem('dc_channel_id');
    if (!botToken || !channelId) return;

    const tbody = document.getElementById('auditTable');
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">جاري جلب وتدقيق المنشورات...</td></tr>`;

    try {
      const res = await fetch(`https://discord.com/api/v10/channels/${channelId}/messages?limit=50`, {
        headers: { Authorization: `Bot ${botToken}` }
      });
      if (!res.ok) throw new Error('فشل الاتصال بـ Discord. تأكد من صحة Bot Token و Channel ID وصلاحيات البوت.');
      const messages = await res.json();

      allParsedPosts = messages.map(msg => parsePost(msg));
      updateCounts();
      renderTable();
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--no)">${err.message}</td></tr>`;
    }
  }

  function parsePost(msg) {
    const text = msg.content || '';
    const nameMatch = text.match(/(?:الاسم|الإسم|Name)\s*[:：-]\s*(.+)/i);
    const dateMatch = text.match(/(?:التاريخ|تاريخ|Date)\s*[:：-]\s*(.+)/i);
    const timeMatch = text.match(/(?:الوقت|وقت|Time)\s*[:：-]\s*(.+)/i);

    const reactions = msg.reactions || [];
    const hasCheck = reactions.some(r => ['✅', '✔️', '☑️'].includes(r.emoji.name));
    const hasCross = reactions.some(r => ['❌', '✖️', '❎'].includes(r.emoji.name));

    let status = 'pending';
    if (hasCheck) status = 'ok';
    else if (hasCross) status = 'no';

    return {
      id: msg.id,
      author: msg.author.global_name || msg.author.username,
      name: nameMatch ? nameMatch[1].trim() : null,
      date: dateMatch ? dateMatch[1].trim() : null,
      time: timeMatch ? timeMatch[1].trim() : null,
      status,
      raw: text
    };
  }

  function updateCounts() {
    document.getElementById('countAll').innerText = allParsedPosts.length;
    document.getElementById('countOk').innerText = allParsedPosts.filter(p => p.status === 'ok').length;
    document.getElementById('countNo').innerText = allParsedPosts.filter(p => p.status === 'no').length;
    document.getElementById('countPending').innerText = allParsedPosts.filter(p => p.status === 'pending').length;
  }

  function setFilter(f) {
    currentFilter = f;
    renderTable();
  }

  function renderTable() {
    const tbody = document.getElementById('auditTable');
    const filtered = allParsedPosts.filter(p => currentFilter === 'all' || p.status === currentFilter);

    if (!filtered.length) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--muted)">لا توجد منشورات مطابقة لهذا الفلتر.</td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map(p => {
      let badge = `<span class="badge badge-pending">⏳ بدون إشارة</span>`;
      if (p.status === 'ok') badge = `<span class="badge badge-ok">✅ صح</span>`;
      if (p.status === 'no') badge = `<span class="badge badge-no">❌ خطأ</span>`;

      return `
        <tr>
          <td><strong>${p.author}</strong></td>
          <td>${p.name || '<span class="missing">غير مذكور</span>'}</td>
          <td>${p.date || '<span class="missing">غير مذكور</span>'}</td>
          <td>${p.time || '<span class="missing">غير مذكور</span>'}</td>
          <td>${badge}</td>
          <td class="raw-msg">${p.raw.substring(0, 120)}${p.raw.length > 120 ? '...' : ''}</td>
          <td>
            <button class="btn-ok" title="وضع إشارة صح" onclick="reactMessage('${p.id}', '%E2%9C%85')">✅</button>
            <button class="btn-no" title="وضع إشارة خطأ" onclick="reactMessage('${p.id}', '%E2%9D%8C')">❌</button>
          </td>
        </tr>
      `;
    }).join('');
  }

  async function reactMessage(messageId, encodedEmoji) {
    const botToken = localStorage.getItem('dc_bot_token');
    const channelId = localStorage.getItem('dc_channel_id');
    try {
      await fetch(`https://discord.com/api/v10/channels/${channelId}/messages/${messageId}/reactions/${encodedEmoji}/@me`, {
        method: 'PUT',
        headers: { Authorization: `Bot ${botToken}` }
      });
      fetchMessages();
    } catch (e) {
      alert('تعذر إضافة الإشارة، تأكد من صلاحية Add Reactions للبوت.');
    }
  }
</script>
</body>
</html>
